server {
    listen 80;
    server_name 2dost.uz www.2dost.uz;

    # HTTP dan HTTPS ga avtomatik yo'naltirish
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 2dost.uz www.2dost.uz;

    # SSL sertifikat yo'llari (Certbot o'rnatgan joy)
    ssl_certificate /etc/letsencrypt/live/2dost.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2dost.uz/privkey.pem;

    # Xavfsizlik sozlamalari
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. FRONTEND
    location / {
        root /var/www/ikki-dost/FRONTEND/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. BACKEND API
    location /api/ {
        proxy_pass http://localhost:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. BACKEND UPLOADS
    location /uploads/ {
        alias /var/www/ikki-dost/BACKEND/uploads/;
    }
}

server {
    listen 80;
    server_name admin.2dost.uz;

