# Production Nginx Configuration
# Buni Ubuntu serverdagi /etc/nginx/sites-available/ikki-dost fayliga saqlang va sites-enabled ga link qiling.

server {
    listen 80;
    server_name yourdomain.com; # Bu yerga serveringiz IP manzili yoki domenni yozing

    # Serverdagi loyiha papkasini to'g'rilang
    # Masalan: /var/www/ikki-dost/

    # 1. FRONTEND (React/Vite statik fayllari)
    location / {
        root /var/www/ikki-dost/FRONTEND/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. ADMIN PANEL (React/Vite statik fayllari)
    location /admin/ {
        alias /var/www/ikki-dost/ADMIN/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 3. BACKEND API (NestJS)
    location /api/ {
        proxy_pass http://localhost:8080/; # Backend ishlab turgan port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. BACKEND UPLOADS (Rasmlar)
    # Nginx orqali to'g'ridan-to'g'ri statik fayllarni o'qish (backendni band qilmasligi uchun tezroq ishlaydi)
    location /uploads/ {
        alias /var/www/ikki-dost/BACKEND/uploads/;
    }
}
